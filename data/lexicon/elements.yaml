# Orðasafn nafnliða — the curated Old Norse element lexicon.
#
# This file is the heart of Nafnaval. Every entry here explains one building
# block of Icelandic names, and because names are compounds, each element
# tagged here explains dozens or hundreds of names at once.
#
# SOURCES. Glosses are drawn from works long out of copyright, so they can be
# quoted and cited freely:
#   Zoëga 1910  — Geir T. Zoëga, A Concise Dictionary of Old Icelandic
#   CV 1874     — Cleasby & Vigfusson, An Icelandic-English Dictionary
#
# FIELDS
#   id        canonical lowercase form used in URLs and matching
#   merking   short Icelandic gloss — this is what the reader sees first
#   skyring   longer note; use it for genuine ambiguity rather than hiding it
#   afbrigdi  spelling/stem variants that should resolve to this element
#             (u-umlaut pairs like bjarn/björn belong here)
#   stada     where the element legitimately appears: forlidur | vidlidur
#             This is what stops "Kristín" being split into krist + ín.
#   flokkar   category slugs the element confers on names containing it
#   heimild   source citation shown next to the gloss
#
# Adding elements: run `npx tsx scripts/analyze-elements.ts --missing` to see
# which uncovered elements would buy the most coverage.

elements:
  # ── Goðafræði og trú ──────────────────────────────────────────────────────
  - id: þór
    merking: guðinn Þór, þruma
    skyring: >-
      Algengasti nafnliður í íslenskum nöfnum. Dregið af Þórr, þrumuguðinum,
      og skylt orðinu þruma. Kemur bæði fram sem forliður (Þórdís) og
      viðliður (Arnþór). Sem viðliður samlagast þ-ið oft og verður -dór:
      Halldór er hall + Þór og Arndór er örn + Þór.
    afbrigdi: [þor, dór, dor]
    stada: [forlidur, vidlidur]
    flokkar: [godafraedi, vedur]
    heimild: Zoëga 1910
  - id: ás
    merking: ás, goð af ætt Ása
    skyring: >-
      Tvíræður liður. Ás merkir goð (eintala af Æsir), en áss getur einnig
      merkt ás í landslagi — langur, mjór hryggur — og bjálka. Í nöfnum er
      goðamerkingin yfirleitt talin upphafleg.
    afbrigdi: [as, áss]
    stada: [forlidur, vidlidur]
    flokkar: [godafraedi, nattura]
    heimild: Zoëga 1910
  - id: guð
    merking: guð
    skyring: >-
      Í heiðnum nöfnum vísar liðurinn til goðanna almennt, en eftir kristnitöku
      til hins kristna guðs. Nöfn eins og Guðrún eru eldri en kristni á Íslandi.
    afbrigdi: [gud, goð]
    stada: [forlidur, vidlidur]
    flokkar: [godafraedi, kristni]
    heimild: Zoëga 1910
  - id: frey
