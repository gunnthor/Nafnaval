  - id: brynja
    merking: brynja, hringabrynja
    skyring: >-
      Herklæði úr samanhnýttum hringum. Algengur forliður (Bryndís,
      Brynhildur) og myndar líka viðliðinn -brynja.
    afbrigdi: [bryn, brynj]
    stada: [forlidur, vidlidur]
