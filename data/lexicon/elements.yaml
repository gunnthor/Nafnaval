    merking: lof, frægð, orðstír
    skyring: >-
      Af hróðr, „lof og frægð“ — það sem kveðið er um mann. Sami liður og í
      Hróaldur og Hróbjartur (sem varð Robert í öðrum málum).
    afbrigdi: [hró, hroð, hróð, hro]
    stada: [forlidur]
