    stada: [vidlidur, forlidur]
    flokkar: [hernadur, nattura]
    heimild: Zoëga 1910
  - id: bert
    merking: bjartur, skínandi
    skyring: >-
      Germanskur liður (beraht, „bjartur“) sem barst inn í norrænu með
      nöfnum eins og Albert og Aðalbert. Sami uppruni og enska bright.
    afbrigdi: [berht]
    stada: [vidlidur]
