  # ── Hernaður og styrkur ───────────────────────────────────────────────────
  - id: hildur
    merking: orrusta, bardagi
    skyring: >-
      Hildr var valkyrjuheiti og merkir „orrusta“. Einn allra algengasti
      kvenkyns viðliður.
    afbrigdi: [hild, hildi]
    stada: [vidlidur, forlidur]
    flokkar: [hernadur, godafraedi]
    heimild: Zoëga 1910
  - id: gunn
    merking: orrusta
    skyring: >-
      Gunnr er sama merking og hildr — bæði orð merkja orrustu. Fornmyndin
      guðr er einnig til en er sleppt hér því hún ruglast við guð í nöfnum
      eins og Guðrún, sem er guð + rún.
    afbrigdi: [gunnr]
    stada: [forlidur, vidlidur]
    flokkar: [hernadur, godafraedi]
    heimild: Zoëga 1910
  - id: sig
    merking: sigur
    afbrigdi: [sigur, sigr]
    stada: [forlidur, vidlidur]
    flokkar: [hernadur]
    heimild: Zoëga 1910
  - id: her
    merking: her, herlið; hermaður
    skyring: >-
      Sem viðliður kemur herr fram sem -arr og loks -ar: Gunnar er gunnr +
      herr, „orrustuhermaður“, og Einar er einn + herr. Þetta er skýringin á
      -ar í fjölda karlmannsnafna.
    afbrigdi: [herj, hers, arr, ar]
    stada: [forlidur, vidlidur]
    flokkar: [hernadur]
    heimild: Zoëga 1910
  - id: geir
    merking: spjót
    afbrigdi: [gar, geirr]
    stada: [forlidur, vidlidur]
    flokkar: [hernadur]
